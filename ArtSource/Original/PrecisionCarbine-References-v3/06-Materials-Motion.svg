<svg xmlns="http://www.w3.org/2000/svg" width="3900" height="3200" viewBox="0 0 3900 3200">
<rect width="100%" height="100%" fill="#edf2ef"/>
<text x="75" y="100" font-family="Arial,sans-serif" font-size="58" fill="#20353f">RAIL ARENA / MATERIAL / MOTION GUIDE</text>
<text x="75" y="165" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Art material zones; proposed production surface responses. Current reference study uses palette + cyan materials.</text>
<text x="75" y="215" font-family="Arial,sans-serif" font-size="27" fill="#20353f">PROPOSED CONSTRUCTION / CREATOR APPROVAL PENDING / source units: metres</text>
<rect x="75" y="310" width="300" height="210" rx="15" fill="#eae8da" stroke="#70878b" stroke-width="3"/>
<text x="430" y="362" font-family="Arial,sans-serif" font-size="38" fill="#20353f">M01 / Ivory ceramic</text>
<text x="430" y="422" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Proposed metallic / roughness: 0.00 / 0.42–0.55</text>
<text x="430" y="482" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Large armor shells; single-facet bevels</text>
<rect x="75" y="620" width="300" height="210" rx="15" fill="#303b41" stroke="#70878b" stroke-width="3"/>
<text x="430" y="672" font-family="Arial,sans-serif" font-size="38" fill="#20353f">M02 / Graphite structure</text>
<text x="430" y="732" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Proposed metallic / roughness: 0.25 / 0.40–0.55</text>
<text x="430" y="792" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Core, cheek rest, reinforcement</text>
<rect x="75" y="930" width="300" height="210" rx="15" fill="#4a7278" stroke="#70878b" stroke-width="3"/>
<text x="430" y="982" font-family="Arial,sans-serif" font-size="38" fill="#20353f">M03 / Deep teal inset</text>
<text x="430" y="1042" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Proposed metallic / roughness: 0.15 / 0.40–0.55</text>
<text x="430" y="1102" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Recessed panels; lower stock accents</text>
<rect x="75" y="1240" width="300" height="210" rx="15" fill="#8f9898" stroke="#70878b" stroke-width="3"/>
<text x="430" y="1292" font-family="Arial,sans-serif" font-size="38" fill="#20353f">M04 / Cool metal</text>
<text x="430" y="1352" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Proposed metallic / roughness: 0.65 / 0.32–0.45</text>
<text x="430" y="1412" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Socket rim, clamps and small fittings</text>
<rect x="75" y="1550" width="300" height="210" rx="15" fill="#292f31" stroke="#70878b" stroke-width="3"/>
<text x="430" y="1602" font-family="Arial,sans-serif" font-size="38" fill="#20353f">M05 / Graphite elastomer</text>
<text x="430" y="1662" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Proposed metallic / roughness: 0.00 / 0.65–0.80</text>
<text x="430" y="1722" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Shoulder pad and grip contact inserts</text>
<rect x="75" y="1860" width="300" height="210" rx="15" fill="#3bd2d9" stroke="#70878b" stroke-width="3"/>
<text x="430" y="1912" font-family="Arial,sans-serif" font-size="38" fill="#20353f">M06 / Restrained cyan</text>
<text x="430" y="1972" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Proposed metallic / roughness: 0.10 / 0.30</text>
<text x="430" y="2032" font-family="Arial,sans-serif" font-size="30" fill="#20353f">Inlays, optic lens and rail liner</text>
<text x="75" y="2290" font-family="Arial,sans-serif" font-size="36" fill="#20353f">MODELING / PRESENTATION STATES</text>
<text x="75" y="2380" font-family="Arial,sans-serif" font-size="29" fill="#20353f">Idle: assembled, no charging geometry or anticipatory opening.</text>
<text x="75" y="2470" font-family="Arial,sans-serif" font-size="29" fill="#20353f">Fire: whole-rifle recoil and brief muzzle effect; separate trigger mesh retained.</text>
<text x="75" y="2560" font-family="Arial,sans-serif" font-size="29" fill="#20353f">Recovery: return to rest within the 0.6s firing cycle. No reload animation.</text>
<text x="75" y="2650" font-family="Arial,sans-serif" font-size="29" fill="#20353f">Fixed capacitor cassette is an art assembly, not a magazine/reload mechanic.</text>
<text x="75" y="2740" font-family="Arial,sans-serif" font-size="29" fill="#20353f">Zoom: stable geometry; no scope extension. Character hands/contacts require fitting.</text>
<text x="75" y="2830" font-family="Arial,sans-serif" font-size="29" fill="#20353f">Glow and flash must remain readable with reduced-flash settings.</text>
<text x="75" y="3150" font-family="Arial,sans-serif" font-size="25" fill="#20353f">Reference study only. Source meshes and all views describe one version; no live Unity asset replaced.</text>
</svg>